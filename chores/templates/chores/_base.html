<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Chore Manager{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'dashboard' %}">Dashboard</a> |
        <a href="{% url 'household_list' %}">Households</a> |
        <a href="{% url 'chore_list' %}">Chores</a>
    </nav>
    <hr>
    {% if messages %}
    <ul>
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    <hr>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
